<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje enviado - Asociación Civil de Plomeros y Sanitaristas de Corrientes</title>
    <meta name="description" content="Confirmación de envío del formulario de contacto.">
    <link rel="icon" type="image/png" href="imagen/logo3.jpg">
    <link rel="stylesheet" href="css/styles-contacto.css?v=3.0">
    <style>
        .confirmacion {
            min-height: 68vh;
            display: grid;
            place-items: center;
            padding: 4rem 1.4rem;
        }
        .confirmacion-card {
            width: min(720px, 100%);
            background: #fff;
            border: 1px solid rgba(13, 60, 97, 0.12);
            border-radius: 18px;
            padding: clamp(2rem, 5vw, 3.5rem);
            text-align: center;
            box-shadow: 0 18px 44px rgba(13, 60, 97, 0.13);
        }
        .confirmacion-card h1 {
            color: #0d3c61;
            margin-bottom: 1rem;
        }
        .confirmacion-card p {
            color: #5f6b75;
            margin-bottom: 1.5rem;
        }
        .confirmacion-card a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            background: #1486cc;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-container">
            <span>Asociación Civil de Plomeros y Sanitaristas de Corrientes</span>
            <span class="topbar-contact"><span class="dot"></span> Contacto institucional</span>
        </div>
    </div>
    <main class="confirmacion">
        <section class="confirmacion-card">
            <h1>Mensaje enviado</h1>
            <p>Recibimos tu consulta. La Asociación se comunicará al correo que indicaste en el formulario.</p>
            <a href="index.html">Volver al inicio</a>
        </section>
    </main>
</body>
</html>
